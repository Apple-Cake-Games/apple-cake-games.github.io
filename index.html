<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Cake Games</title>
    <link rel="icon" type="image/x-icon" href="/assets/AppleCakeGames.png">
    <link rel="stylesheet" href="/css/index.css">

</head>
<body>
    <header class="header">
        <h1 class="header_h1">Alien Hazard</h1>
    </header>

    <div class="information">
        <button id="btnPlay"></button>
        <button id="btnShop"></button>
        <button id="btnStats"></button>
        <button id="btnSettings"></button>
        <button id="btnCredits"></button>
        <button id="btnQuit"></button>
    </div>

    <div id="shop-overlay" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 4px solid #ffd700; padding: 20px; z-index: 1000; color: white; font-family: monospace; text-align: center; min-width: 300px;">
    <h2>Item-Shop</h2>
    <p>Guthaben: <span id="shop-balance">0</span> <img src="/assets/gameelements/ui/Coin.png" style="vertical-align: middle; margin-bottom: 2px; width: 18px;"></p>
    <hr>
    <div id="skin-list"></div>
    <button onclick="closeShop()" style="margin-top: 20px; cursor: pointer; padding: 5px 10px;">ZURÜCK</button>
    </div>

    <div id="settings-overlay" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 4px solid #ffd700; padding: 20px; z-index: 1000; color: white; font-family: monospace; text-align: center; min-width: 300px;">
    <h2>Options</h2>
    <button id="toggleSound" onclick="toggleSound()">Sound: AN</button>
    <hr>
    <button onclick="closeSettings()" style="margin-top: 20px; cursor: pointer; padding: 5px 10px;">ZURÜCK</button>
    </div>

    <div class="github">
        <img id="icnGithub" src="https://upload.wikimedia.org/wikipedia/commons/c/c2/GitHub_Invertocat_Logo.svg" alt="GitHub-Icon">
    </div>

    <script src="/scripts/economy.js"></script>
    <script src="/scripts/index.js"></script>
</body>
</html>
