<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Cake Games</title>
    <link rel="icon" type="image/x-icon" href="/assets/AppleCakeGames.png" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header_h1">Alien Hazard</h1>
    </header>

    <div id="start-screen">
      <div class="start-icon"></div>
      <h1>Alien Hazard</h1>
      <p class="click-hint">Click to Start</p>
    </div>

    <div class="information">
      <button
        id="btnPlay"
        onmouseenter="playSound(hoverSound)"
        onclick="playSound(clickSound)"
      ></button>
      <button
        id="btnShop"
        onmouseenter="playSound(hoverSound)"
        onclick="playSound(clickSound)"
      ></button>
      <button
        id="btnStats"
        onmouseenter="playSound(hoverSound)"
        onclick="playSound(clickSound)"
      ></button>
      <button
        id="btnSettings"
        onmouseenter="playSound(hoverSound)"
        onclick="playSound(clickSound)"
      ></button>
      <button
        id="btnCredits"
        onmouseenter="playSound(hoverSound)"
        onclick="playSound(clickSound)"
      ></button>
      <button
        id="btnQuit"
        onmouseenter="playSound(hoverSound)"
        onclick="playSound(clickSound)"
      ></button>
    </div>

    <div
      id="shop-overlay"
      style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        border: 4px solid #ffd700;
        padding: 20px;
        z-index: 1000;
        color: white;
        font-family: monospace;
        text-align: center;
        min-width: 300px;
      "
    >
      <h2>Item-Shop</h2>
      <p>
        Guthaben: <span id="shop-balance">0</span>
        <img
          src="/assets/gameelements/ui/Coin.png"
          style="vertical-align: middle; margin-bottom: 2px; width: 18px"
        />
      </p>
      <hr />
      <div id="skin-list"></div>
      <button
        onclick="closeShop()"
        style="margin-top: 20px; cursor: pointer; padding: 5px 10px"
      >
        ZURÜCK
      </button>
    </div>

    <div
      id="settings-overlay"
      style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        border: 4px solid #ffd700;
        padding: 20px;
        z-index: 1000;
        color: white;
        font-family: monospace;
        text-align: center;
        min-width: 300px;
      "
    >
      <h2>Options</h2>
      <button id="toggleSound" onclick="toggleSound()">Sound: AN</button>
      <hr />
      <button
        onclick="closeSettings()"
        style="margin-top: 20px; cursor: pointer; padding: 5px 10px"
      >
        ZURÜCK
      </button>
    </div>

    <div
      id="credits-overlay"
      style="
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        border: 4px solid #ffd700;
        padding: 20px;
        z-index: 1000;
        color: white;
        font-family: monospace;
        text-align: center;
        min-width: 300px;
        box-shadow: 10px 10px 0px rgba(255, 215, 0, 0.2);
        image-rendering: pixelated;
      "
    >
      <h2>Credits</h2>
      <div style="margin: 20px 0; line-height: 1.6">
        <p>Entwickelt von:</p>
        <b style="color: #ffd700">Apple Cake Games</b>
        <p style="margin-top: 15px">Grafik & Design:</p>
        <span style="color: #00d4ff">toni-designs</span>
        <p style="margin-top: 15px">Programmierung:</p>
        <span style="color: #00d4ff">max-studios</span>
        <p style="margin-top: 15px">Beta-Tester:</p>
        <span style="color: #00d4ff">-</span>
      </div>
      <hr style="border: 1px solid #ffd700; margin-bottom: 20px" />
      <button
        onclick="closeCredits()"
        style="
          cursor: pointer;
          padding: 10px 20px;
          background: transparent;
          color: white;
          border: 2px solid #ffd700;
          font-family: inherit;
          font-weight: bold;
          text-transform: uppercase;
        "
      >
        ZURÜCK
      </button>
    </div>

    <div class="github">
      <img
        id="icnGithub"
        src="https://upload.wikimedia.org/wikipedia/commons/c/c2/GitHub_Invertocat_Logo.svg"
        alt="GitHub-Icon"
      />
    </div>

    <script src="/scripts/settings.js"></script>
    <script src="/scripts/economy.js"></script>
    <script src="/scripts/index.js"></script>
  </body>
</html>
