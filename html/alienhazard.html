<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Alien Hazard | Apple Cake Games</title>
    <link rel="icon" type="image/x-icon" href="/assets/AppleCakeGames.png" />
    <link rel="stylesheet" href="/css/alienhazard.css" />
  </head>
  <body>
    <div id="settings-menu">
      <h2>MENU</h2>
      <button
        onclick="
          document.getElementById('settings-menu').style.display = 'none'
        "
      >
        SCHLIESSEN
      </button>
      <br />
      <button id="toggleSound" onclick="toggleSound()">Sound: AN</button>
      <br />
      <button
        id="settings-menu-back-to-menu"
        onclick="window.open('../index.html', '_top')"
      >
        BACK TO MENU
      </button>
    </div>

    <div id="shop-overlay">
      <h2>Skin-Boutique</h2>
      <p>
        Guthaben: <span id="shop-balance" style="color: #ffd700">0</span> 💎
      </p>
      <hr style="border: 1px solid #00d4ff" />

      <div id="skin-list"></div>

      <button class="shop-close-btn" onclick="closeShop()">ZURÜCK</button>
    </div>

    <button
      onclick="document.getElementById('settings-menu').style.display = 'block'"
      style="
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.8);
        border: 2px solid #00d4ff;
        color: #00d4ff;
        padding: 5px 10px;
        cursor: pointer;
        font-family: monospace;
      "
    >
      MENU
    </button>

    <div class="ui">
      <div id="real-clock">Lädt...</div>
      Zeit: <span id="timer">0.00</span>s | Punkte: <span id="score">0</span>
      <hr style="border: 0; border-top: 1px solid #00d4ff; margin: 10px 0" />

      <b style="font-size: 0.8em">Highscores:</b>
      <div id="highscore-list" style="font-size: 0.7em; margin-top: 5px">
        Lädt...
      </div>

      <div
        style="
          margin-top: 12px;
          padding-top: 8px;
          border-top: 2px dashed #00d4ff;
          color: #ffd700;
          font-weight: bold;
        "
      >
        Guthaben: <span id="total-coins-display">0</span>
        <img src="/assets/gameelements/ui/Coin.png" />
      </div>
    </div>

    <div id="item-display" class="ui" style="top: 200px; display: none">
      <b>Aktiv:</b>
      <span id="item-name"
        ><img src="/assets//gameelements/ui/ActiveShield.png" /></span
      ><br />
      Zeit: <span id="item-timer">10.00</span>s
    </div>

    <div id="game-container">
      <div id="player"></div>
    </div>

    <div id="game-over-screen">
      <h1></h1>
      /
      <p><span id="final-score">0</span></p>

      <div class="button-container">
        <button id="btnRerun" onclick="location.reload()"></button>
        <button
          id="btnHome"
          onclick="window.open('../index.html', '_top')"
        ></button>
      </div>
    </div>

    <script src="/scripts/settings.js"></script>
    <script src="../scripts/economy.js"></script>
    <script src="/scripts/alienhazard.js"></script>
  </body>
</html>
