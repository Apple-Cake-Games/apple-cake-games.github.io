<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/fence.css" />
  </head>
  <body>
    <div class="game-wrapper">
      <iframe src="alienhazard.html" class="gamebox" id="game-iframe"></iframe>
      <div class="game-frame"></div>
    </div>
    <div class="ui">
      <div id="real-clock">Lädt...</div>
      Zeit: <span id="timer">0.00</span>Punkte: <span id="score">0</span>
      <hr style="border: 0; border-top: 1px solid #00d4ff; margin: 10px 0" />
      <b>Highscores:</b>
      <div id="highscore-list" style="font-size: 0.7em; margin-top: 5px">
        Lädt...
      </div>
      <div
        style="
          margin-top: 12px;
          padding-top: 8px;
          border-top: 2px dashed #00d4ff;
          color: #ffd700;
          font-weight: bold;
        "
      >
        Guthaben: <span id="total-coins-display">0</span>
        <img src="/assets/gameelements/ui/Coin.png" />
      </div>
    </div>
  </body>
  <script>
    window.addEventListener('load', function () {
      const box = document.getElementById('game-iframe');
      if (box) {
        box.focus();
      }
    });

    // Hier empfängt die Hauptseite die Nachrichten aus dem iFrame
    window.addEventListener('message', function (event) {
      const data = event.data;

      // 1. Live-Punkte spiegeln
      if (data.score !== undefined) {
        document.getElementById('score').innerText = data.score;
      }

      // 2. Live-Timer spiegeln
      if (data.timer !== undefined) {
        document.getElementById('timer').innerText = data.timer;
      }

      // 3. Uhrzeit spiegeln
      if (data.clock !== undefined) {
        document.getElementById('real-clock').innerText = data.clock;
      }

      // 4. Highscores & Coins aus dem LocalStorage laden (das ist auch lokal erlaubt!)
      const scores = JSON.parse(localStorage.getItem('game_scores_v2')) || [];
      document.getElementById('highscore-list').innerHTML =
        scores.length > 0
          ? scores
              .map(
                (s, i) =>
                  `${i + 1}. <b>${s.points} Pkt</b> <small>${s.date}</small>`
              )
              .join('<br>')
          : 'Keine Rekorde';

      // Versuche das Guthaben anzuzeigen, falls vorhanden
      const totalCoins = localStorage.getItem('total_coins') || '0';
      document.getElementById('total-coins-display').innerText = totalCoins;
    });
  </script>
</html>
